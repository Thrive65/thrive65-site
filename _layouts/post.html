---
layout: default
---
<section class="page-header bg-surface-alt">
  <div class="wrapper">
    {% if page.category %}<p class="text-eyebrow">{{ page.category }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    <p class="text-deemphasized">{{ page.date | date: "%B %-d, %Y" }}</p>
  </div>
</section>
<div class="wave" style="--wave-above: var(--band-alt); --wave-below: var(--bg);"></div>
<article class="post prose wrapper region flow">
  {{ content }}
</article>
