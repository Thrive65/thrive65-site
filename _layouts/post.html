---
layout: default
---
<article class="post wrap">
  <header class="post__header">
    <p class="post__eyebrow">Op-Ed</p>
    <h1 class="post__title">{{ page.title }}</h1>
    <p class="post__date">{{ page.date | date: "%B %-d, %Y" }}</p>
  </header>
  <div class="post__body">
    {{ content }}
  </div>
</article>
