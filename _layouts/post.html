---
layout: default
---
<article class="post wrapper region">
  <header>
    <p class="text-eyebrow">{{ page.category }}</p>
    <h1>{{ page.title }}</h1>
    <p class="text-deemphasized">{{ page.date | date: "%B %-d, %Y" }}</p>
  </header>
  <div class="flow">
    {{ content }}
  </div>
</article>
