name: Build and deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: # lets you trigger a manual rebuild from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; new pushes cancel an in-progress build.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Cache the resolved node_modules keyed on the lockfile. A Google Docs
      # publish only touches content (no package-lock.json change), so it hits
      # the cache and skips the install below — the full CSS toolchain is only
      # reinstalled when dependencies actually change.
      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install CSS toolchain
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Optimize CSS (PurgeCSS + preset-env + cssnano)
        run: npm run build:css

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
