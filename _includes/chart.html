{%- comment -%}
  Site-wide line-chart figure, drawn by assets/js/charts.js (set `charts: true`
  in the page's front matter).
    include.spec        a chart spec from _data: {legend, panels} or {legend, variants}
    include.labelledby  id of the heading that names the figure
    include.caption     optional figure title (a <figcaption>, which names the figure)
    include.cls         optional extra classes (e.g. chapter-fig)
    include.table       optional: a _data table object to show in place of the
                        per-panel data tables; spec.table == "none" shows none
  Renders the legend, one .chart per panel (with its title/note), the
  variant .choice-group (hidden until JS can act on it) and a "Show the data
  as a table" accordion built from the same spec, so the figure reads
  without JavaScript.
{%- endcomment -%}
{%- assign spec = include.spec -%}
{%- if spec.variants -%}{%- assign panels = spec.variants.first.panels -%}{%- else -%}{%- assign panels = spec.panels -%}{%- endif -%}
<figure class="card flow {{ include.cls }}" style="--card-padding: var(--space-s)" data-chart-figure{% if include.labelledby %} aria-labelledby="{{ include.labelledby }}"{% endif %}>
{%- if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}
{%- if spec.variants %}
<div class="cluster" data-variants hidden>
  <span class="text-meta">{{ spec.variantLabel }}:</span>
  <div class="choice-group compact" role="group" aria-label="{{ spec.variantLabel | escape }}">
  {%- for v in spec.variants %}<button type="button" class="choice compact" data-variant="{{ v.id }}" aria-pressed="{% if forloop.first %}true{% else %}false{% endif %}">{{ v.label }}</button>{% endfor -%}
  </div>
</div>
{%- endif %}
{%- if spec.legend.size > 0 %}
{% include charts/legend.html items=spec.legend %}
{%- endif %}
<div class="{% if panels.size > 1 %}grid-wide{% endif %}">
{%- for p in panels %}
<div class="flow flow-space-2xs">
  {%- if p.title %}<p class="repel text-meta"><strong>{{ p.title }}</strong>{% if p.note %}<span class="text-deemphasized">{{ p.note }}</span>{% endif %}</p>{% endif %}
  <div class="chart" data-panel="{{ forloop.index0 }}"></div>
</div>
{%- endfor %}
</div>
<script type="application/json" data-chart-spec>{{ spec | jsonify }}</script>
{%- unless spec.table == "none" %}
<details class="accordion">
  <summary class="cluster"><span>Show the data as a table</span><span class="accordion-icon" aria-hidden="true"></span></summary>
  <div class="accordion-body flow">
  {%- if include.table %}
    {% include charts/data-table.html table=include.table %}
  {%- elsif spec.variants %}
    {%- for v in spec.variants %}{% for p in v.panels %}
    {%- capture cap %}{{ p.title }}, {{ spec.variantLabel | downcase }}: {{ v.label }}{% endcapture %}
    {% include charts/line-table.html panel=p caption=cap %}
    {%- endfor %}{% endfor %}
  {%- else %}
    {%- for p in panels %}
    {%- capture cap %}{% if p.title %}{{ p.title }}{% else %}Chart data{% endif %}{% endcapture %}
    {% include charts/line-table.html panel=p caption=cap %}
    {%- endfor %}
  {%- endif %}
  </div>
</details>
{%- endunless %}
</figure>
