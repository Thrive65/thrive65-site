<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}

<link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/assets/images/favicon.ico' | relative_url }}" sizes="any">
<link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,700;0,800;1,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<script>
  (function () {
    // Progressive-enhancement flag: components that collapse content only do
    // so once JS can reveal it again (see the `html.js` guards in main.css).
    document.documentElement.classList.add("js");
    var t = localStorage.getItem("theme") || "auto";
    var dark = t === "dark" ||
      (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();

  // ---------------------------------------------------------------------- //
  // Display & accessibility settings.
  //
  // Each mode is an attribute on <html> with one localStorage key, restored
  // before paint by the IIFE above (theme) / its Phase 4+ siblings. The panel
  // itself is a Disclosure (see below); this block wires the controls inside it.
  // ---------------------------------------------------------------------- //
  (function () {
    // Keep the Light | Dark segmented control's aria-pressed in sync with theme.
    function syncTheme() {
      var cur = document.documentElement.getAttribute("data-theme");
      document.querySelectorAll(".a11y-segment").forEach(function (b) {
        b.setAttribute("aria-pressed", b.getAttribute("data-theme-value") === cur ? "true" : "false");
      });
    }
    document.addEventListener("DOMContentLoaded", syncTheme);

    // Atkinson Hyperlegible backs the dyslexia-friendly font (Phase 5b). It's
    // only ever needed once the panel is open, so load it lazily on first open.
    var fontLoaded = false;
    function loadFont() {
      if (fontLoaded) return;
      fontLoaded = true;
      var l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = "https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap";
      document.head.appendChild(l);
    }

    document.addEventListener("click", function (e) {
      if (!e.target.closest) return;

      // Theme segmented control — flip the attribute, persist, resync pressed.
      var seg = e.target.closest(".a11y-segment");
      if (seg) {
        var val = seg.getAttribute("data-theme-value");
        document.documentElement.setAttribute("data-theme", val);
        localStorage.setItem("theme", val);
        syncTheme();
        return;
      }

      // First open of the panel pulls in the dyslexia font.
      if (e.target.closest(".a11y-toggle")) { loadFont(); return; }

      // ✕ and Done both close the panel and return focus to the trigger.
      if (e.target.closest("[data-a11y-close]")) {
        Disclosure.set(document.querySelector(".a11y-toggle"), false, true);
        return;
      }

      // Reset all — clear the four a11y keys and return theme to Light. (Phase
      // 4+ attributes get removed here as they're added.)
      if (e.target.closest(".a11y-reset")) {
        ["a11y-contrast", "a11y-cvd", "a11y-dyslexic", "a11y-textsize"].forEach(function (k) {
          localStorage.removeItem(k);
        });
        document.documentElement.setAttribute("data-theme", "light");
        localStorage.setItem("theme", "light");
        syncTheme();
        return;
      }
    });
  })();

  // ---------------------------------------------------------------------- //
  // Disclosure — a generic show/hide controller for any trigger + region.
  //
  // Mark a trigger with these attributes and it just works (dropdowns, menus,
  // modals, …); no per-widget wiring:
  //   aria-controls="REGION_ID"  the element it shows/hides
  //   aria-expanded="false"      current state (the controller keeps it live)
  //   data-disclosure="GROUP"    identifies it as a disclosure; a non-empty
  //                              GROUP makes same-group triggers exclusive
  //   data-dismiss="outside esc focusout"  space list of auto-close rules
  //                              (optional; defaults to "outside esc")
  //
  // The region is shown/hidden via the `hidden` attribute, so un-enhanced
  // markup (no JS) stays visible and reachable. Closing via Escape returns
  // focus to the trigger.
  // ---------------------------------------------------------------------- //
  var Disclosure = (function () {
    function region(trigger) { return document.getElementById(trigger.getAttribute("aria-controls")); }
    function isOpen(trigger) { return trigger.getAttribute("aria-expanded") === "true"; }
    function triggers() { return Array.prototype.slice.call(document.querySelectorAll("[data-disclosure]")); }
    function openTriggers() { return triggers().filter(isOpen); }
    function dismiss(trigger) { return (trigger.getAttribute("data-dismiss") || "outside esc").split(/\s+/); }

    function set(trigger, open, returnFocus) {
      if (!trigger || isOpen(trigger) === open) return;
      if (open) closeGroup(trigger);
      trigger.setAttribute("aria-expanded", open ? "true" : "false");
      var r = region(trigger);
      if (r) r.hidden = !open;
      if (!open && returnFocus) trigger.focus();
    }
    function closeGroup(except) {
      var group = except.getAttribute("data-disclosure");
      if (!group) return;
      triggers().forEach(function (t) {
        if (t !== except && t.getAttribute("data-disclosure") === group) set(t, false);
      });
    }

    document.addEventListener("click", function (e) {
      if (!e.target.closest) return;
      var trigger = e.target.closest("[data-disclosure]");
      if (trigger) { set(trigger, !isOpen(trigger)); return; }
      // A click outside an open region closes triggers that opt into "outside".
      openTriggers().forEach(function (t) {
        var r = region(t);
        if (dismiss(t).indexOf("outside") !== -1 && r && !r.contains(e.target)) set(t, false);
      });
    });
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Escape") return;
      openTriggers().forEach(function (t) {
        if (dismiss(t).indexOf("esc") !== -1) set(t, false, true);
      });
    });
    document.addEventListener("focusout", function (e) {
      var to = e.relatedTarget; // element gaining focus (null when leaving the page)
      openTriggers().forEach(function (t) {
        if (dismiss(t).indexOf("focusout") === -1) return;
        var r = region(t);
        if (to && (t.contains(to) || (r && r.contains(to)))) return;
        set(t, false);
      });
    });

    return { set: set };
  })();

  // Nav dropdowns — enhance each nested nav list into a disclosure button
  // (the leading label text node of the <li> becomes the button label).
  {% capture chevron_svg %}{% include icons/chevron.svg %}{% endcapture %}
  var CHEVRON_SVG = {{ chevron_svg | strip | jsonify }};
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".site-header nav li > ul").forEach(function (menu, i) {
      var li = menu.parentNode, label = "", node = li.firstChild;
      while (node && node !== menu) {
        var next = node.nextSibling;
        if (node.nodeType === 3) { label += node.textContent; li.removeChild(node); }
        node = next;
      }
      menu.id = menu.id || "nav-menu-" + i;
      menu.hidden = true;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "nav-dropdown-toggle";
      btn.setAttribute("aria-expanded", "false");
      btn.setAttribute("aria-controls", menu.id);
      btn.setAttribute("data-disclosure", "nav");            // exclusive group
      btn.setAttribute("data-dismiss", "outside esc focusout");
      btn.innerHTML = label.trim() + " " + CHEVRON_SVG;
      li.insertBefore(btn, menu);
    });
  });

  // Language dropdown — the visible EN/ES control. Elfsight does the actual
  // translation: it reads a `?lang=<code>` query param on load and persists the
  // choice itself, so selecting a language just reloads with the new param.
  (function () {
    var LANGS = { "en-US": "EN", "es-MX": "ES" };
    var LS_KEY = "WebsiteTranslator.language.91448ae8-7a99-4960-b854-caa497c1ea85";
    // Resolve the active language. The ?lang= param wins because on an explicit
    // switch it is correct immediately, whereas Elfsight only writes its own
    // store *after* translating (so it's stale on that first post-click load).
    // Fall back to Elfsight's persisted value for a bare URL (no param yet).
    function current() {
      var p = new URLSearchParams(location.search).get("lang");
      if (LANGS[p]) return p;
      try {
        var v = JSON.parse(localStorage.getItem(LS_KEY)).value;
        if (LANGS[v]) return v;
      } catch (e) {}
      return "en-US"; // nothing chosen → English default
    }
    // Reflect a language in the trigger label and the menu checkmarks. The
    // .lang-code text is excluded from translation in the Elfsight dashboard, so
    // it's safe to set as plain text.
    function reflect(active) {
      var code = document.querySelector(".lang-toggle .lang-code");
      if (code) code.textContent = LANGS[active];
      document.querySelectorAll(".lang-menu button[data-lang]").forEach(function (b) {
        b.setAttribute("aria-checked", b.getAttribute("data-lang") === active ? "true" : "false");
      });
    }
    document.addEventListener("DOMContentLoaded", function () { reflect(current()); });
    // Selecting a language: update the control immediately (so the state is right
    // even before the reload paints), then reload with ?lang=<code>.
    document.addEventListener("click", function (e) {
      if (!e.target.closest) return;
      var item = e.target.closest(".lang-menu button[data-lang]");
      if (!item) return;
      var code = item.getAttribute("data-lang");
      if (code === current()) { // already active — just close the menu
        Disclosure.set(document.querySelector(".lang-toggle"), false, true);
        return;
      }
      reflect(code);
      var url = new URL(location.href);
      url.searchParams.set("lang", code);
      location.href = url.toString();
    });
  })();

  // Mobile nav — hamburger toggles a slide-in panel (delegated)
  function closeNav() {
    var header = document.querySelector(".site-header");
    if (!header) return;
    header.classList.remove("nav-open");
    document.body.classList.remove("nav-open");
    var t = header.querySelector(".nav-toggle");
    if (t) t.setAttribute("aria-expanded", "false");
  }
  document.addEventListener("click", function (e) {
    if (!e.target.closest) return;
    var toggle = e.target.closest(".nav-toggle");
    if (toggle) {
      var header = toggle.closest(".site-header");
      var open = header.classList.toggle("nav-open");
      document.body.classList.toggle("nav-open", open);
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
      return;
    }
    // Close the mobile panel when tapping the backdrop or following a nav link
    // (dropdown toggles are buttons, so they don't match and don't close it).
    if (e.target.closest(".nav-backdrop") || e.target.closest(".site-header nav a")) {
      closeNav();
    }
  });
  document.addEventListener("keydown", function (e) {
    // Dropdowns handle their own Escape (via the Disclosure controller); this
    // closes the mobile slide-in panel.
    if (e.key === "Escape") closeNav();
  });

  // ---------------------------------------------------------------------- //
  // Heading anchors — GitHub-style copy-link on content headings + FAQ items.
  //
  // Prose headings with an id get a hover-revealed chain icon that copies an
  // absolute deep link and shows a "Link copied" toast. FAQ items ship the
  // anchor server-side (see faq.html); the shared click handler and the
  // open-on-hash routine handle the accordion case too.
  // ---------------------------------------------------------------------- //
  (function () {
    // Shared with faq.html's server-rendered anchor (see _includes/icons/link.svg).
    {% capture anchor_svg %}{% include icons/link.svg %}{% endcapture %}
    var ANCHOR_SVG = {{ anchor_svg | strip | jsonify }};

    var toastEl, toastTimer;
    function toast() {
      if (!toastEl) {
        toastEl = document.createElement("div");
        toastEl.className = "toast";
        toastEl.setAttribute("role", "status");
        toastEl.setAttribute("aria-live", "polite");
        toastEl.textContent = "Link copied";
        document.body.appendChild(toastEl);
      }
      // Force reflow so re-triggering restarts the transition.
      toastEl.classList.remove("is-visible");
      void toastEl.offsetWidth;
      toastEl.classList.add("is-visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove("is-visible"); }, 2000);
    }

    function copy(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(toast, fallback);
      } else {
        fallback();
      }
      function fallback() {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "absolute";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (err) {}
        document.body.removeChild(ta);
        toast();
      }
    }

    // Inject copy-link anchors into prose headings that carry an id (kramdown
    // emits these). FAQ anchors are server-rendered, so skip anything already
    // holding one.
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll("main :is(h2, h3, h4)[id]").forEach(function (h) {
        if (h.closest(".page-header") || h.querySelector(".heading-anchor")) return;
        var a = document.createElement("a");
        a.className = "heading-anchor";
        a.href = "#" + h.id;
        a.setAttribute("aria-label", "Copy link to section: " + h.textContent.trim());
        a.innerHTML = ANCHOR_SVG;
        h.insertBefore(a, h.firstChild);
      });
      openHash();
    });

    // Shared click handler for every .heading-anchor (prose + FAQ).
    document.addEventListener("click", function (e) {
      if (!e.target.closest) return;
      var a = e.target.closest(".heading-anchor");
      if (!a) return;
      e.preventDefault();
      e.stopPropagation(); // keep FAQ <summary> from toggling the accordion
      var id = a.getAttribute("href").slice(1);
      copy(location.origin + location.pathname + a.getAttribute("href"));
      history.replaceState(null, "", "#" + id);
      var item = document.getElementById(id);
      if (item && item.classList.contains("faq-item")) item.open = true;
    });

    // Expand and reveal a FAQ item when its id is the URL fragment.
    function openHash() {
      var id = location.hash.slice(1);
      if (!id) return;
      var el = document.getElementById(id);
      if (el && el.classList.contains("faq-item")) {
        el.open = true;
        var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
      }
    }
    window.addEventListener("hashchange", openHash);
  })();
</script>

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
