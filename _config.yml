title: Thrive65
tagline: Community advocacy for District 65 schools
description: >-
  Thrive65 is a coalition of Evanston/Skokie families, educators, and
  neighbors advocating for strong, well-resourced District 65 schools.
url: "https://wethrive65.org" # primary custom domain (wethrive65.com forwards here at the registrar)
baseurl: "" # blank: served at the root of the custom domain (see CNAME)

# Google Analytics 4 — Measurement ID (G-XXXXXXXXXX). Only loads in the
# production build (see _includes/head.html), so localhost/PR builds don't
# pollute stats. Leave blank to disable analytics entirely.
google_analytics: "G-X35S9LPMK8"

# Contact / signup
# The homepage embeds the EmailOctopus signup form directly in index.md (see the #signup section).
signup_form_action: "" # (optional/unused) generic form POST URL — kept for reference only

# SEO / social sharing (consumed by jekyll-seo-tag)
# NOTE: image/logo are PLACEHOLDERS — replace with real branded assets (see TODO.md).
# The default social image is set per-page via `defaults` below (seo-tag reads
# page-level `image`, not a site-level one). Its hash form emits og:image
# width/height/alt + twitter:image, and auto-selects the summary_large_image card.
logo: /assets/images/logo.png # square brand mark → Organization schema logo
social:
  name: Thrive65
  links: [] # TODO: add real profile URLs (Facebook, X, Instagram…) → schema.org sameAs
# twitter:
#   username: thrive65   # TODO: set real X/Twitter handle → emits twitter:site @handle

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:title/

# Publish posts dated in the future. Board meeting previews are dated for the
# upcoming meeting, so with Jekyll's default (false) they'd be dropped from the
# build until the meeting day.
future: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "page"
      # Default social share image (jekyll-seo-tag). Pages/posts may override
      # `image:` in their own front matter. PLACEHOLDER — see TODO.md.
      image:
        path: /assets/images/og-default.png
        width: 1200
        height: 630
        alt: Thrive65 — community advocacy for District 65 schools

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - README.html
  - README_files
  - CLAUDE.md
  - TODO.md
  - EXPLANATION.md
  - apps-script
  - node_modules
  - package.json
  - package-lock.json
  - postcss.config.cjs
