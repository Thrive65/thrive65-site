title: "Thrive65 in the News"
items:
  - outlet: "Evanston Now"
    headline: "'The cuts have to happen somewhere'"
    date: "2026-09-21"
    url: "https://evanstonnow.com/the-cuts-have-to-happen-somewhere/"
    blurb: "At a Thrive65 community meeting, the group urged D65 residents to weigh in on which programs to protect amid $20M in proposed cuts."
  - outlet: "Evanston Round Table"
    headline: "New Thrive65 group encourages parents to help inform District 65 budget cuts"
    date: "2026-09-20"
    url: "https://evanstonroundtable.com/2026/09/20/thrive65-new-district-65-parent-advocacy-group/"
    blurb: "A profile of the newly formed Thrive65 and its call for parents to share priorities as D65 faces $20M in cuts and possible closures."
  - outlet: "Evanston Now"
    headline: "Cutting through the info clutter about D65"
    date: "2026-09-19"
    url: "https://evanstonnow.com/cutting-through-the-info-clutter-about-d65/"
    blurb: "A look at Thrive65, founded by two D65 parents pushing the district toward fiscal stability and clearer information."
  - outlet: "Chicago Sun-Times"
    headline: "Evanston-Skokie parents fear impact as district looks to cut $20 million, close 2 schools"
    date: "2026-09-18"
    url: "https://chicago.suntimes.com/education/2026/09/18/evanston-skokie-parents-fear-impact-hope-for-stability-as-district-looks-to-cut-20-million-close-2-schools"
    blurb: "Evanston/Skokie parents voice anxiety as D65 plans to cut $20M and close at least two schools amid a structural deficit."
  - outlet: "Evanston Round Table"
    headline: "Community members react as District 65 prepares to close more schools"
    date: "2026-09-16"
    url: "https://evanstonroundtable.com/2026/09/16/community-members-react-as-district-65-prepares-to-close-more-schools/"
    blurb: "Parents and advocacy groups react to D65's plan to cut $20M and close more buildings, urging transparency and protection for vulnerable students."
  - outlet: "Daily Northwestern"
    headline: "D65 parents urge community advocacy following announcement of additional reductions, two school closures"
    date: "2026-09-22"
    url: "https://dailynorthwestern.com/2026/09/22/city/d65-parents-urge-community-advocacy-following-announcement-of-additional-reductions-two-school-closures/"
    blurb: "Thrive65, a newly-formed community coalition, organized the meeting to equip attendees with the information needed to navigate changes in the district."
