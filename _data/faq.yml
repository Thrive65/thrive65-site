  - question: "Are walkable schools a civil right? Am I in a school desert?"
    answer: |
      Walkability isn't a formally recognized legal right the way, say, protection from housing discrimination is. But it's a value District 65 families consistently rank as their top priority, and we think that's worth taking seriously for everyone in the district, not selectively.
      
      Here's why we say "for everyone": the history matters, and it's now documented precisely. Evanston's 5th Ward, a historically Black neighborhood, lost its only neighborhood school in 1967 and went without one for more than 50 years, including through a 2012 referendum that would have rebuilt it and failed. Ward-level results from that vote show the **5th Ward itself voted 67% yes** — more than 2-to-1 in favor of funding its own walkable school — while the district's north-side wards (Wards 6 and 7, home to the schools most central to today's walkability advocacy) voted against it by the widest margins of any wards in the entire election: roughly 65% and 64% "no," respectively — and were decisive in defeating it.
      
      We raise this not to relitigate 2012, but because it's directly relevant to how "walkability" gets used today. If walkability is genuinely our shared value, it has to apply evenly, including to the community that was asked to wait the longest for it, and including when it means other neighborhoods share some of the disruption that rightsizing requires. We'd encourage anyone asking "am I in a school desert?" to look at actual current boundary maps and the relative size of the district for the number of schools rather than assume, but we'd also encourage everyone to ask that question with this full history in view, not just their own family's experience of it.
      
      *Sources: Daily Northwestern, "From Foster to Family Focus: More Than a Century of District 65 Decisions in the 5th Ward" (2022); ward-level 2012 referendum results, compiled election data.*
      
      ### Who was Devon Horton, and how did his tenure affect our finances?
      
      Devon Horton served as District 65 superintendent from June 2020 to June 2023, then left for a higher-paying superintendent job in Georgia. In October 2025, he was indicted on 17 federal counts — wire fraud, embezzlement, and tax evasion — tied to an alleged kickback scheme involving vendor contracts with both District 65 and Chicago Public Schools. He and his co-defendants have pleaded not guilty; a three-week jury trial is scheduled for October 2026, and the board has commissioned a forensic audit covering his tenure and its aftermath.
      
      Beyond the criminal case, a documented pattern of financial mismanagement during this period compounded the district's structural challenges: zero-based budgeting (a rigorous line-by-line budget discipline) was quietly abandoned, financial statements were delivered late or not at all, required contract-approval processes weren't followed, and the district absorbed roughly $20 million in unbudgeted deficits across two fiscal years that nobody had flagged in advance. Two new six-figure executive positions were created without ever being brought to the board for approval. The decision to finance Foster School through lease certificates rather than a referendum — avoiding a public vote, but loading a recurring payment onto the operating budget rather than a dedicated capital stream — was also made during this period.
      
      None of this erases the real, separate structural pressure of revenue not keeping up with costs but it means a meaningful share of today's crisis traces to specific decisions and a specific breakdown in oversight. While time will tell, the current board seems eager to maintain and build upon the financial controls and other practices to ensure we do not face the same level of malfeasance, such that board members do not even have truthful information to inform their policy making and oversight. 
      
      *Sources: FOIA Gras newsletter, "District 65's Financial Problems are the Result of Mismanagement" (April 2026); Evanston RoundTable, ["Devon Horton, ex-District 65 chief, faces criminal charges"](https://evanstonroundtable.com/2025/10/09/former-district-65-superintendent-horton-indicted/) (Oct. 9, 2025), ["Financial malfeasance allegations followed Horton for years"](https://evanstonroundtable.com/2025/10/12/devon-horton-past-financial-malfeasance/) (Oct. 12, 2025), ["Former D65 Superintendent Still Owes Over $10,000 Due to Late Payments"](https://evanstonroundtable.com/2025/10/18/former-d65-superintendent-still-owes-over-10000-due-to-late-payments/) (Oct. 18, 2025), and ["Trial for Former District 65 Superintendent Set for October"](https://evanstonroundtable.com/2026/02/11/trial-for-former-district-65-superintendent-set-for-october/) (Feb. 11, 2026).*
