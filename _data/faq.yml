title: "FAQs"
items:
  - question: "When did this structural deficit start and what caused it?"
    answer: |
      Earlier than most people realize, and it was never a surprise. The district was projecting this same structural deficit as far back as 2015–2016, publicly disclosing a projected cumulative deficit of $112 million by 2025 in community information sessions well before 2018\. In March 2017, the board approved $5.1 million in contingency cuts to take effect automatically if a pending referendum failed. When voters approved that referendum in April 2017 (about 80% yes), the district's own projections showed operating deficits growing from $5.1 million in FY2018 to $24.4 million by FY2025 without it — and the $135.6 million the referendum was projected to raise over eight years was sized specifically to cover that gap through roughly the mid-2020s, after which further cuts were always going to be necessary.
      
      In other words: the 2017 referendum wasn't a fix for an unknown problem — it was a deliberately time-limited bridge, sold to voters on the premise that the district would use the intervening years to restructure its cost base. Two things determined how that played out:
      
      Structural pressure: enrollment has fallen roughly 22–25% since 2018 — nearly double the decline of comparable nearby districts — while the district's building footprint and staffing didn't shrink to match. Rising costs added to the strain: total special education spending grew 57% in a single year (FY23–FY24), and federal COVID relief funding that had propped up staffing and programs ran out.
      
      Specific mismanagement: during Superintendent Devon Horton's tenure (June 2020–June 2023), rigorous budgeting practices (zero-based budgeting) were quietly abandoned, financial statements were delivered late or not at all, required approval processes for large contracts weren't followed, and the district absorbed roughly $20 million in unbudgeted losses across two fiscal years that nobody flagged in advance. Horton was later indicted on 17 federal fraud, embezzlement, and tax charges (he has pleaded not guilty; trial is set for October 2026).
      
      Put simply: the referendum bought the district roughly seven years to fix its cost structure before the bridge ran out. Instead of using that runway, the district largely spent it — and the underlying mismatch between costs and enrollment that voters were warned about in 2016 is the same mismatch driving the crisis today.
      
      *Sources: Evanston RoundTable, ["80% Yes\! D65 Referendum Passes"](https://evanstonroundtable.com/2017/04/05/80-yes-d65-referendum-passes/) (April 5, 2017); ["From a Referendum to Budget Deficits: How District 65 Got Here"](https://evanstonroundtable.com/2025/03/23/from-a-referendum-to-budget-deficits-how-district-65-got-here/) (March 23, 2025); ["Devon Horton, ex-District 65 chief, faces criminal charges"](https://evanstonroundtable.com/2025/10/09/former-district-65-superintendent-horton-indicted/) (Oct. 9, 2025); Evanston Now, ["D65: budget cuts could hit classroom"](https://evanstonnow.com/d65-budget-cuts-could-hit-classroom/) (Aug. 2024).*
  - question: "What has the district done about it?"
    answer: |
      The district has been executing a multi-year Structural Deficit Reduction Plan (SDRP) in three official phases:
      
      - **Phase I (FY25):** $6.5 million in cuts, 39 positions eliminated (mostly attrition/vacancies).  
      - **Phase II (FY26):** $13.2 million in cuts, roughly 100 positions eliminated, including nearly halving the superintendent's executive cabinet (11 → 7).  
      - **Phase III (FY27–FY30):** a cumulative target of **$16–18 million** by FY2030, which includes both the closure of Kingsley Elementary and Bessie Rhodes and ongoing year-by-year budget reductions. The FY27 slice alone is $6.3 million.
      
      Beyond the SDRP, the district has engaged a forensic audit of 2020–2024 spending, commissioned a new, more rigorous Master Facilities Plan, and brought in new board members and interim leadership.
      
      **Why this matters, in the district's own numbers:** the district's own financial model shows that *without* these cuts, it would run out of cash entirely by **FY2030 (going from 107 days of cash on hand in FY25 to *negative* 14 days by FY30)**. *With* the Phase III cuts applied, it's projected to hit and hold exactly 90 days of cash on hand every year through FY30. This is about as clear a "why" as a district can offer, straight from its own modeling — not a warning from an outside consultant or an advocacy group.
      
      **An important caveat:** independent analysis of the district's own growth assumptions suggests Phase III may be a five-year reprieve rather than a permanent fix. State law caps property tax revenue growth at roughly 2–2.5% per year, while the district's own underlying cost growth (driven mostly by labor costs) runs closer to 3.9% per year. Extending the district's own model forward, the same cash crunch appears to re-emerge by FY33–35 absent further cuts or new recurring revenue — meaning a future referendum is likely necessary eventually, not optional.
      
      *Sources: District 65 Board of Education presentation, "Expenditure Reduction Plan: SDRP Phase 3 Reductions" (April 13, 2026\) — the FY31-35 extrapolation is independent analysis built from this presentation's own figures, not a district projection.*
  - question: "Is our deficit because of Foster School’s construction?"
    answer: |
      Our structural deficit was not caused by Foster’s construction, but it is a recurring expense that we will have for decades. Foster was financed through **lease certificates** rather than a voter referendum — a financing mechanism the district could approve without a public vote. That decision means Foster's roughly **$3.2 million annual lease payment** comes directly out of the same operating budget now being cut for staff and programs, rather than from a separate capital funding stream a referendum would have created.
      
      There's also an active, unresolved funding gap specific to finishing the building: lease certificate proceeds (the original $40 million raised in 2022\) are projected to run out with a payment due in **August 2026 — the same month Foster opens** — leaving roughly **$4.8 million** still needed to complete the project. The district has tentatively earmarked $4 million in proceeds from selling the soon-to-close Bessie Rhodes building to cover this, but as of mid-2026 that sale hasn't closed, and the district's own finance office has warned the timing doesn't line up — Rhodes proceeds aren't expected to be available before the August 2026 payment is due. Board President Nichole Pinkard put the stakes plainly: if that funding doesn't come through as planned, "I don't think anyone is up for $4 million of staffing cuts" — meaning more cuts, not a magic solution, would likely be the fallback.
      
      So: Foster is one real factor among several —flaws in public education funding structures, staffing levels, rising special-education costs, and Horton-era mismanagement are all larger contributors to the overall deficit than Foster's financing alone — but the completion-funding gap is a live risk worth watching closely through 2026\.
      
      *Sources: Evanston RoundTable, ["Lease Certificates 101"](https://evanstonroundtable.com/2022/12/21/lease-certificates-101-everything-to-know-about-funding-for-fifth-ward-school/) (Dec. 21, 2022\) and ["District 65 Discusses Possible Sale of Bessie Rhodes and Kingsley"](https://evanstonroundtable.com/2026/05/19/district-65-discusses-possible-sale-of-bessie-rhodes-and-kingsley/) (May 19, 2026); Evanston Now, ["D65 Needs More Money to Finish Foster"](https://evanstonnow.com/d65-needs-more-money-to-finish-foster/) (May 2026\) and ["D65: Six Groups Interested in Acquiring Rhodes"](https://evanstonnow.com/d65-six-groups-interested-in-acquiring-rhodes/) (May 18, 2026); District 65 "2026-2027 (FY27) Preliminary Budget" memo (June 22, 2026).*
  - question: "Why build a new school when we have a structural deficit?"
    answer: |
      Because Foster is answering a different, much older problem than the one driving the current deficit — and the history here matters for understanding why.
      
      Evanston's 5th Ward — a historic Black neighborhood — lost its only neighborhood school in 1967, when Foster was converted into a magnet school as part of the district's desegregation plan, busing Black students to schools across the district. In 1979, community advocates pushed to reopen Foster instead of closing other neighborhood schools; the district's own analysis showed this would have required *busing fewer total students* — it simply would have shifted which students bore the disruption. The board voted 5-2 to keep Foster closed. In 2010, even while the district *needed more space* due to rising enrollment, a board member's proposal to build a 5th Ward school got no support from colleagues; the board instead considered raising class sizes. In 2012, a referendum that would have funded a 5th Ward school failed — and ward-level results show the 5th Ward itself voted more than 2-to-1 in favor, while the district's north-side wards (home to the schools most central to today's "walkability" advocacy) voted against it by the widest margins in the entire election. Foster wasn't approved for construction until 2022 — 55 years after it closed.
      
      Given that history, Foster is best understood as the long-overdue fulfillment of a decades-old promise, not an example of poor fiscal planning. And the two problems genuinely coexist: the district has **too many** underused buildings elsewhere (all ten K-5 elementary schools now enroll below the Illinois state average) and, for over 50 years, had **zero** walkable schools in the one neighborhood that was promised one. Rightsizing the rest of the footprint while finally delivering Foster addresses both realities honestly, rather than making one community wait even longer to fix an enrollment problem that is not reflected in their ward.
      
      *Sources: Evanston RoundTable, "Foster School: Its Role in Desegregating School District 65 in 1967 and Its Closing in 1979"; "D65 School Board to Retain Consultant to Study Wide Range of 'Momentous' Issues" (2009); "D65 Board Considering a Cap and Transfer Strategy and Increasing Class Sizes" (2010); the Daily Northwestern, "From Foster to Family Focus: More Than a Century of District 65 Decisions in the 5th Ward" (2022); ward-level 2012 referendum results compiled from official election data.*
  - question: "Why are we spending so much on facilities?"
    answer: |
      Because the buildings are old and have been underfunded for years. The average District 65 building is more than **80 years old**. A rigorous new facilities study (StudioGC, 2026\) found the district needs roughly **$395–598 million** in repairs over the next several decades (depending on how inflation is counted) — more than double a 2021 estimate that only looked 20 years out. Only two district buildings are currently rated in good condition. The district only last year committed to spent $2.7 million a year to capital repairs against a need several times that size — and even that modest commitment has been cut into by over 10% to help balance our preliminary 2027-28 annual budget.
      
      One clarifying note: an average Facilities Condition Index (FCI) of 41% means major repairs are needed — it does not mean buildings are "beyond repair," and neither the $395M nor $598M figure is a lump sum due immediately; both are phased, multi-decade estimates. This is central to the rightsizing case regardless: spreading inadequate maintenance dollars across too many aging buildings means none of them gets properly fixed. Consolidating to fewer, better-maintained buildings is what makes real investment possible.
      
      *Sources: Evanston RoundTable, "District 65 Discusses Report Projecting $598 Million in Facilities Spending Over Next 49 Years" (March 24, 2026); Evanston Now, "D65: Almost $600M in Repairs Needed" (March 2026); Cordogan Clark facilities report (2021).*
  - question: "Is lower enrollment at our schools a problem?"
    answer: |
      Yes, and it's a core component of the "rightsizing" argument — though the district's own most recent demographic study (2024) shows the picture is more nuanced than "endless decline."
      
      District-wide elementary building utilization is below 60%. Every one of the district's ten K-5 elementary schools enrolls below the Illinois state average school size of 387 students. Meanwhile, salaries and benefits make up about 70% of the budget, so a shrinking number of students spread across a fixed number of buildings and staff positions is mathematically where the deficit comes from.
      
      The district's own demographer projects a real decline of about 401 students (-7.3%) over the next five years, but then the decline nearly flattens — just 55 more students (-1.0%) over the following five years, with a slight uptick projected in the final two years. So enrollment isn't in freefall forever; it's declining meaningfully now and then leveling off around a new, smaller "normal" — which is exactly why rightsizing to that new normal, rather than waiting for a rebound that isn't coming, is the district's core challenge.
      
      *Sources: District 65, "Updated Demography Study as of December 2024" memo (Feb. 10, 2025), summarizing the McKibben Demographics report (2024) and the prior Kofron Demography Report (2021); NCES Digest of Education Statistics 2022, Table 216.75.*
  - question: "Can’t we focus on bringing back kids in private schools?"
    answer: |
      It's worth being precise here, since two different narratives circulate. The district's own 2024 demographic study offers a direct answer: comparing census-counted school-age children living in the district to how many actually attend D65, the district's "capture rate" fell only modestly — from a median of 81.7% in 2020 to 79.3% in 2024\. That's real, but it means voluntary departure is a contributing factor, not the dominant one. The bigger driver, per the district's own demographer, is that there are genuinely fewer school-age children living here now: an aging population, more empty-nest households, and low turnover of existing homes.
      
      Growing enrollment is still a worthwhile goal, and some community groups have proposed ambitious targets (for example, adding roughly 200 students per year). But those types of recruitment efforts require things outside of a school district’s control. Things like zoning, affordability, and birth rates. And an idea to recruit more students can't substitute for aligning today's costs to today's enrollment: even optimistic outreach takes years to show results, while the budget gap is immediate; and rebuilding the trust needed to win families back is easier from a rightsized, solvent starting point than from continued deficits. Pursue enrollment growth alongside rightsizing, not instead of it.
      
      *Sources: District 65, "Updated Demography Study as of December 2024" memo (Feb. 10, 2025); "Whatever It Takes" (WIT) alternative SDRP III proposal, community-submitted document written or endorsed by IINS, Washington Task Force, and Legion of Data Nerds.*
  - question: "Shouldn’t we just cut more admin?"
    answer: |
      Administrative cuts are legitimate, real, and already underway — the superintendent's cabinet has been nearly halved, and multiple independent community analyses (arriving at similar numbers separately) show the district could still save roughly $1.4–1.6 million a year by bringing its admin-to-student ratio in line with peer districts. We support continuing this work — and it's worth knowing that a real, documented amount of today's admin bloat traces to specific decisions made during the Horton era: two entirely new six-figure executive positions (a Deputy Superintendent role and a Chief of Staff role) were created without ever being brought to the board for approval.
      
      But it's important to be honest about scale: administration is about 6.3% of the total budget, while salaries and benefits overall are about 70%. Even a full, aggressive rightsizing of administrative headcount doesn't come close to closing a $16–18 million structural gap on its own. There's also a timing cost to delay: at least one member who served on the SDRP Finance Committee has argued the district "wasted a critical year" in which admin and facilities cuts could have been made sooner — delay that shows up directly in the district's weakening cash position. The case for cutting admin isn't just "where's the money" — it's also "the longer we wait, the worse our options get."
      
      Sources: Legion of Data Nerds, "Financial Levers Memo" (Nov. 12, 2025, community-submitted document); Invest in Neighborhood Schools proposal letter (community-submitted document); Evanston RoundTable, "Financial malfeasance allegations followed Horton for years" (Oct. 12, 2025); District 65 staff memo comparing peer districts (Nov. 2023, ISBE 2024 data).
  - question: "What about all the community ideas I’ve heard about?"
    answer: |
      Several community coalitions have put forward alternatives to the district's own closure scenarios, and it's worth knowing that all of them converge on closing at most one additional school, not two or more — a real point of consensus worth taking seriously, and one that's close to what the board actually chose (Kingsley alone, with Lincolnwood's status still pending). Where they differ is mostly in how big the available savings actually are: some estimates bundle in speculative or already-planned savings that inflate the apparent total, while others are more conservative — one estimated a single closure at just $1.69 million, less than 1% of the district's roughly $190 million budget. Ideas like administrative rightsizing and facility co-location show up credibly across multiple independent proposals; other ideas — sliding-scale fees, cell-tower leasing, facility rentals, and similar "creative revenue" — are individually modest, mostly unverified with a real counterparty, and shouldn't be counted on as a primary solution. We think the most useful takeaway isn't any single proposal's dollar figure, but the fact that a genuine community consensus exists around a single-closure, trust-rebuilding path.
      
      Sources: Legion of Data Nerds, "Financial Levers Memo" (Nov. 12, 2025); Invest in Neighborhood Schools, proposal letter to the D65 Board; "Whatever It Takes" (WIT), alternative SDRP III path proposal — all community-submitted documents.
