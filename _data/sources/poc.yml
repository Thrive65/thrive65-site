# Proof-of-concept source set (Phase 0). Paired with /sources-poc/, which is
# unlinked and noindexed. Delete both once the design is proven — or keep them
# as a permanent regression fixture (decided at Gate 3).
#
# One entry = one document. The number is POSITIONAL: items[i] is source i+1.
# Never add an `n:` key — a stored number and a list position drift the first
# time anyone reorders. Append new entries at the end.
#
# Only `title` is required. Omit `url:` entirely when there is no link; the entry
# then renders as an honest unlinked citation instead of a placeholder.
key: poc
title: "Sources"
